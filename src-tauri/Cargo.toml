[package]
name = "zhiti"
version = "1.0.1"
description = "知题 · AI 智能题库桌面端"
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

[features]
custom-protocol = ["tauri/custom-protocol"]
